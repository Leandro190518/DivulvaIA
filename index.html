<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DivulgaIA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}header{background:#111827;color:#fff;padding:28px 20px}header>div,main{max-width:1050px;margin:auto}h1{margin:0 0 6px}header p{margin:0;color:#cbd5e1}main{padding:24px 20px;display:grid;grid-template-columns:360px 1fr;gap:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 6px 20px #0000000b}label{display:block;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}textarea{min-height:90px}.btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:14px;font-weight:700;cursor:pointer;background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #d1d5db;background:white;padding:8px 12px;border-radius:20px;cursor:pointer}.tab.active{background:#111827;color:#fff}.out{white-space:pre-wrap;line-height:1.55;min-height:390px}.small{font-size:13px;color:#64748b}@media(max-width:800px){main{grid-template-columns:1fr}}</style></head><body><header><div><h1>✨ DivulgaIA</h1><p>Sua divulgação pronta em poucos segundos.</p></div></header><main><section class="card"><h2>Nova campanha</h2><p class="small">Preencha os dados e gere textos prontos para vender.</p><label>Nome do negócio</label><input id="nome" placeholder="Ex.: Salgados da Alê"><label>Produto/serviço</label><input id="produto" placeholder="Ex.: salgados"><label>Oferta/preço</label><input id="oferta" placeholder="Ex.: 25 unidades por R$15"><label>WhatsApp</label><input id="whatsapp" placeholder="(11) 99999-9999"><label>Instagram</label><input id="instagram" placeholder="@seunegocio"><label>Objetivo</label><select id="objetivo"><option>Vender</option><option>Atrair clientes</option><option>Divulgar promoção</option><option>Lançar produto</option></select><label>Detalhes</label><textarea id="detalhes" placeholder="Entrega, bairro, prazo, diferenciais..."></textarea><button class="btn" onclick="gerar()">🚀 Gerar campanha</button><button class="btn secondary" onclick="location.reload()">Limpar</button></section><section class="card"><div class="tabs"><button class="tab active" onclick="aba('whatsapp',this)">WhatsApp</button><button class="tab" onclick="aba('instagram',this)">Instagram</button><button class="tab" onclick="aba('stories',this)">Stories</button><button class="tab" onclick="aba('reels',this)">Reels</button><button class="tab" onclick="aba('calendario',this)">7 dias</button></div><div id="out" class="out">Sua campanha aparecerá aqui.</div><button class="btn secondary" onclick="copiar()">📋 Copiar</button></section></main><script>let s={};const g=id=>document.getElementById(id).value.trim();function gerar(){let n=g('nome')||'Seu negócio',p=g('produto')||'seu produto',o=g('oferta')||'uma oferta especial',w=g('whatsapp')||'seu WhatsApp',i=g('instagram')||'seu Instagram',d=g('detalhes');s.whatsapp=`🔥 ${n} está com uma oferta especial!\n\n${o}\n\nAproveite e peça ${p}.\n\n📲 WhatsApp: ${w}\n${d}`;s.instagram=`🚨 OFERTA ESPECIAL — ${n}\n\n${o}\n\nQuer aproveitar? Entre em contato agora.\n\n📲 ${w}\n📸 ${i}\n\n#promoção #oferta #comprelocal`;s.stories=`STORY 1\n👀 Você já viu a oferta da ${n}?\n\nSTORY 2\n🔥 ${o}\n\nSTORY 3\n📲 Chame agora: ${w}\n\nSTORY 4\n⏰ Aproveite enquanto estiver disponível!`;s.reels=`ROTEIRO — 20 SEGUNDOS\n\n0–4s: Mostre o produto.\nTexto: “Você já viu essa oferta?”\n\n4–10s: Mostre o produto em detalhe.\nTexto: “${o}”\n\n10–16s: Mostre o diferencial.\nTexto: “Peça na ${n}.”\n\n16–20s: CTA\nTexto: “📲 Chame: ${w}”`;s.calendario=`7 DIAS\n\nSEG — Oferta principal\nTER — Bastidores\nQUA — Benefício do produto\nQUI — Depoimento/prova social\nSEX — Oferta com urgência\nSÁB — Produto em destaque\nDOM — Pergunta/enquete`;aba('whatsapp',document.querySelector('.tab'))}function aba(k,e){if(!s[k])return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('out').textContent=s[k]}async function copiar(){await navigator.clipboard.writeText(document.getElementById('out').textContent);alert('Copiado!')}</script></body></html>
