<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DivulgaIA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fa;
  color:#172033;
}

header{
  background:#111827;
  color:#fff;
  padding:28px 20px;
}

header>div,main{
  max-width:1050px;
  margin:auto;
}

h1{margin:0 0 6px}

header p{
  margin:0;
  color:#cbd5e1;
}

main{
  padding:24px 20px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  box-shadow:0 6px 20px #0000000b;
}

label{
  display:block;
  font-weight:700;
  margin:13px 0 6px;
}

input,textarea,select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:15px;
}

textarea{min-height:90px}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:14px;
  font-weight:700;
  cursor:pointer;
  background:#111827;
  color:#fff;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.tab{
  border:1px solid #d1d5db;
  background:white;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
}

.tab.active{
  background:#111827;
  color:#fff;
}

.out{
  white-space:pre-wrap;
  line-height:1.55;
  min-height:390px;
}

.small{
  font-size:13px;
  color:#64748b;
}

.status{
  margin-top:10px;
  font-size:13px;
  color:#64748b;
}

@media(max-width:800px){
  main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div>
<h1>✨ DivulgaIA</h1>
<p>Sua divulgação pronta em poucos segundos.</p>
</div>
</header>

<main>

<section class="card">

<h2>Nova campanha</h2>

<p class="small">
Preencha os dados e deixe a IA criar sua divulgação.
</p>

<label>Nome do negócio</label>
<input id="nome" placeholder="Ex.: Salgados da Alê">

<label>Produto/serviço</label>
<input id="produto" placeholder="Ex.: salgados">

<label>Oferta/preço</label>
<input id="oferta" placeholder="Ex.: 25 unidades por R$15">

<label>WhatsApp</label>
<input id="whatsapp" placeholder="(11) 99999-9999">

<label>Instagram</label>
<input id="instagram" placeholder="@seunegocio">

<label>Região</label>
<input id="regiao" placeholder="Ex.: Barueri e região">

<label>Objetivo</label>
<select id="objetivo">
<option>Vender</option>
<option>Atrair clientes</option>
<option>Divulgar promoção</option>
<option>Lançar produto</option>
</select>

<label>Detalhes</label>
<textarea id="detalhes" placeholder="Entrega, bairro, prazo, diferenciais..."></textarea>

<button class="btn" onclick="gerar()">
🚀 Gerar campanha com IA
</button>

<button class="btn secondary" onclick="limpar()">
Limpar
</button>

<div id="status" class="status"></div>

</section>

<section class="card">

<div class="tabs">

<button class="tab active" onclick="aba('whatsapp',this)">
WhatsApp
</button>

<button class="tab" onclick="aba('instagram',this)">
Instagram
</button>

<button class="tab" onclick="aba('stories',this)">
Stories
</button>

<button class="tab" onclick="aba('reels',this)">
Reels
</button>

<button class="tab" onclick="aba('calendario',this)">
7 dias
</button>

</div>

<div id="out" class="out">
Sua campanha aparecerá aqui.
</div>

<button class="btn secondary" onclick="copiar()">
📋 Copiar
</button>

</section>

</main>

<script>

let campanhas={};

const valor=id=>{
  return document.getElementById(id).value.trim();
};

async function gerar(){

  const status=document.getElementById("status");
  const out=document.getElementById("out");

  const dados={
    businessName:valor("nome"),
    product:valor("produto"),
    offer:valor("oferta"),
    whatsapp:valor("whatsapp"),
    instagram:valor("instagram"),
    region:valor("regiao"),
    objective:valor("objetivo"),
    details:valor("detalhes")
  };

  if(!dados.businessName && !dados.product){

    status.textContent="Digite pelo menos o nome do negócio e o produto/serviço.";
    return;
  }

  status.textContent="🤖 Criando sua campanha...";

  out.textContent="A IA está preparando sua divulgação...";

  try{

    const resposta=await fetch("/api/campaign",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(dados)
    });

    const resultado=await resposta.json();

    if(!resposta.ok){

      throw new Error(
        resultado.error || "Erro ao gerar campanha."
      );
    }

    const texto=resultado.result || "";

    campanhas.whatsapp=texto;
    campanhas.instagram=texto;
    campanhas.stories=texto;
    campanhas.reels=texto;
    campanhas.calendario=texto;

    out.textContent=texto;

    status.textContent="✅ Campanha criada com sucesso!";

  }catch(erro){

    console.error(erro);

    status.textContent=
      "❌ Não foi possível gerar a campanha. Tente novamente.";

    out.textContent=
      "Ocorreu um erro ao conectar com a IA.";
  }
}

function aba(tipo,botao){

  if(!campanhas[tipo]){
    return;
  }

  document
    .querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  botao.classList.add("active");

  document.getElementById("out").textContent=
    campanhas[tipo];
}

async function copiar(){

  const texto=document.getElementById("out").textContent;

  if(!texto || texto==="Sua campanha aparecerá aqui."){
    return;
  }

  try{

    await navigator.clipboard.writeText(texto);

    document.getElementById("status").textContent=
      "📋 Texto copiado!";

  }catch(e){

    alert("Não foi possível copiar automaticamente.");
  }
}

function limpar(){

  document.querySelectorAll("input,textarea").forEach(
    campo=>campo.value=""
  );

  document.getElementById("objetivo").value="Vender";

  document.getElementById("out").textContent=
    "Sua campanha aparecerá aqui.";

  document.getElementById("status").textContent="";

  campanhas={};
}

</script>

</body>
  </html>
