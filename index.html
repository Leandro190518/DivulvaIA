<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DivulgaIA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      color: #2563eb;
    }

    header p {
      margin-top: 8px;
      color: #667085;
      font-size: 17px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #2563eb;
      color: white;
      flex: 1;
    }

    .clear {
      background: #e5e7eb;
      color: #111827;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #2563eb;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .tab {
      background: #e5e7eb;
      color: #374151;
      white-space: nowrap;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .content {
      display: none;
    }

    .content.active {
      display: block;
    }

    .result-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      min-height: 220px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .copy {
      margin-top: 12px;
      background: #16a34a;
      color: white;
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>DivulgaIA</h1>
      <p>Sua divulgação pronta em poucos segundos.</p>
    </header>

    <div class="card">

      <label>Nome do negócio</label>
      <input id="businessName" placeholder="Ex.: Salgados da Alê">

      <label>Produto ou serviço</label>
      <input id="product" placeholder="Ex.: Coxinhas e salgados">

      <label>Oferta / preço</label>
      <input id="offer" placeholder="Ex.: 25 unidades por R$15">

      <label>WhatsApp</label>
      <input id="whatsapp" placeholder="Ex.: (11) 99999-9999">

      <label>Instagram</label>
      <input id="instagram" placeholder="Ex.: @salgadosdaale">

      <label>Região</label>
      <input id="region" placeholder="Ex.: Barueri e região">

      <label>Objetivo</label>
      <select id="objective">
        <option value="">Selecione</option>
        <option value="Vender">Vender</option>
        <option value="Atrair clientes">Atrair clientes</option>
        <option value="Divulgar produto">Divulgar produto</option>
        <option value="Divulgar serviço">Divulgar serviço</option>
        <option value="Ganhar seguidores">Ganhar seguidores</option>
      </select>

      <label>Detalhes</label>
      <textarea id="details" placeholder="Ex.: Entrega no Parque Viana"></textarea>

      <div class="buttons">
        <button class="generate" onclick="gerarCampanha()">
          🚀 Gerar campanha com IA
        </button>

        <button class="clear" onclick="limparFormulario()">
          Limpar
        </button>
      </div>

      <div id="loading" class="loading">
        🤖 Preparando sua campanha...
      </div>

      <div id="error" class="error"></div>

    </div>

    <div class="card">

      <div class="tabs">

        <button class="tab active" onclick="mostrarAba('whatsapp', this)">
          WhatsApp
        </button>

        <button class="tab" onclick="mostrarAba('instagram', this)">
          Instagram
        </button>

        <button class="tab" onclick="mostrarAba('stories', this)">
          Stories
        </button>

        <button class="tab" onclick="mostrarAba('reels', this)">
          Reels
        </button>

        <button class="tab" onclick="mostrarAba('calendario', this)">
          7 dias
        </button>

      </div>

      <div id="whatsapp" class="content active">
        <div id="textoWhatsapp" class="result-box">
          Sua mensagem para WhatsApp aparecerá aqui.
        </div>
        <button class="copy" onclick="copiarTexto('textoWhatsapp')">
          📋 Copiar WhatsApp
        </button>
      </div>

      <div id="instagram" class="content">
        <div id="textoInstagram" class="result-box">
          Sua legenda para Instagram aparecerá aqui.
        </div>
        <button class="copy" onclick="copiarTexto('textoInstagram')">
          📋 Copiar Instagram
        </button>
      </div>

      <div id="stories" class="content">
        <div id="textoStories" class="result-box">
          Seus Stories aparecerão aqui.
        </div>
        <button class="copy" onclick="copiarTexto('textoStories')">
          📋 Copiar Stories
        </button>
      </div>

      <div id="reels" class="content">
        <div id="textoReels" class="result-box">
          Seu roteiro de Reels aparecerá aqui.
        </div>
        <button class="copy" onclick="copiarTexto('textoReels')">
          📋 Copiar Reels
        </button>
      </div>

      <div id="calendario" class="content">
        <div id="textoCalendario" class="result-box">
          Seu calendário de 7 dias aparecerá aqui.
        </div>
        <button class="copy" onclick="copiarTexto('textoCalendario')">
          📋 Copiar calendário
        </button>
      </div>

    </div>

  </div>

<script>

async function gerarCampanha() {

  const loading = document.getElementById("loading");
  const error = document.getElementById("error");

  loading.style.display = "block";
  error.style.display = "none";

  const dados = {
    businessName: document.getElementById("businessName").value,
    product: document.getElementById("product").value,
    offer: document.getElementById("offer").value,
    whatsapp: document.getElementById("whatsapp").value,
    instagram: document.getElementById("instagram").value,
    region: document.getElementById("region").value,
    objective: document.getElementById("objective").value,
    details: document.getElementById("details").value
  };

  try {

    const resposta = await fetch("/api/campaign", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dados)
    });

    const resultado = await resposta.json();

    if (!resposta.ok || !resultado.success) {
      throw new Error(
        resultado.error || "Não foi possível gerar a campanha."
      );
    }

    document.getElementById("textoWhatsapp").textContent =
      resultado.whatsapp || "Nenhum conteúdo gerado.";

    document.getElementById("textoInstagram").textContent =
      resultado.instagram || "Nenhum conteúdo gerado.";

    document.getElementById("textoStories").textContent =
      resultado.stories || "Nenhum conteúdo gerado.";

    document.getElementById("textoReels").textContent =
      resultado.reels || "Nenhum conteúdo gerado.";

    document.getElementById("textoCalendario").textContent =
      resultado.calendario || "Nenhum conteúdo gerado.";

  } catch (e) {

    console.error(e);

    error.textContent =
      "Ocorreu um erro ao conectar com a IA. " + e.message;

    error.style.display = "block";

  } finally {

    loading.style.display = "none";

  }
}


function mostrarAba(nome, botao) {

  document.querySelectorAll(".content").forEach(function(elemento) {
    elemento.classList.remove("active");
  });

  document.querySelectorAll(".tab").forEach(function(elemento) {
    elemento.classList.remove("active");
  });

  document.getElementById(nome).classList.add("active");

  botao.classList.add("active");
}


async function copiarTexto(id) {

  const texto = document.getElementById(id).textContent;

  try {

    await navigator.clipboard.writeText(texto);

    alert("Texto copiado!");

  } catch (e) {

    alert("Não foi possível copiar automaticamente.");

  }
}


function limparFormulario() {

  document.querySelectorAll("input, textarea").forEach(function(elemento) {
    elemento.value = "";
  });

  document.getElementById("objective").value = "";

  document.getElementById("textoWhatsapp").textContent =
    "Sua mensagem para WhatsApp aparecerá aqui.";

  document.getElementById("textoInstagram").textContent =
    "Sua legenda para Instagram aparecerá aqui.";

  document.getElementById("textoStories").textContent =
    "Seus Stories aparecerão aqui.";

  document.getElementById("textoReels").textContent =
    "Seu roteiro de Reels aparecerá aqui.";

  document.getElementById("textoCalendario").textContent =
    "Seu calendário de 7 dias aparecerá aqui.";

  document.getElementById("error").style.display = "none";
}

</script>

</body>
          </html>
